# cargo-deny (MVP 1 plan, M8): known vulnerabilities, licences, duplicate or
# wildcard dependencies, and where crates come from.
#   cargo deny check
[graph]
# What the app ships: three Android ABIs and Linux.
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# The RustSec advisory database; vulnerabilities are always errors.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences that only ask for the notice (the app's licence page
# lists them: app/tool/rust_licences.dart).
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are never published (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The bridge depends on the core by path, without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
