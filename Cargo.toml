[package]
name = "secure_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Security core of the app (D26)"
publish = false

[dependencies]
# Pinned exactly: updates are deliberate and reviewed. Cryptography from
# RustCrypto (D45).
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = { version = "=0.11.1", default-features = false }
subtle = "=2.6.1"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-normalization = "=0.1.26"
zxcvbn = { version = "=3.1.1", default-features = false }
thiserror = "=2.0.21"

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"
hex = "=0.4.3"

# Argon2id and the ciphers run fast even in debug builds and tests.
[profile.dev.package."*"]
opt-level = 3
